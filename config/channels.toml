# Реестр каналов NPPAD (источник: README репозитория thu-inet, Table 2).
# Сгенерирован из README; правки — вручную с записью в docs/decisions.md.
#
# label_proxy = true: величина описывает саму неисправность (расход/энергия течи,
# течь трубок ПГ, разрыв питательной линии). Такие величины не измеряются
# штатными приборами и фактически кодируют метку сценария, поэтому
# не допускаются ни в генератор, ни (по умолчанию) в верификатор. См. D-007.

schema_version = "1.0.0"
time_column = "TIME"
# Столбцы, присутствующие в части файлов SLBIC, но отсутствующие в README: отбрасываются (D-005).
ignored_columns = ["WPCS", "WPMU", "WPFW"]

