# Конфигурация диагностического контура (этапы A–B дорожной карты).
# Все параметры, влияющие на результаты, задаются здесь, а не в коде (требование 13).

config_version = "1.1.0"
seed = 42

[paths]
nppad_raw = "NPPAD/raw/Operation_csv_data"
nppad_reports = "NPPAD/raw/NPPAD"
processed = "data/processed/nppad"
models = "data/models"
ethz_events = "data/processed/ethz/events.json"

[generator]
# Разрешённые каналы генератора: 6 из 96 (D-006).
# По одному представителю на каждую из шести критических функций безопасности
# (Critical Safety Functions), которые оператор PWR контролирует в первую очередь:
#   PWNT — подкритичность (мощность по нейтронному потоку, %)
#   TAVG — охлаждение активной зоны (средняя температура теплоносителя, °C)
#   PSGA — теплоотвод (давление в ПГ A, bar)
#   P    — целостность первого контура (давление, bar)
#   PRB  — защитная оболочка (давление в здании реактора, bar)
#   LVPZ — запас теплоносителя (уровень в компенсаторе давления, %)
allowed_channels = ["PWNT", "TAVG", "PSGA", "P", "PRB", "LVPZ"]
top_k = 3

[windows]
# Шаг данных NPPAD — 10 с. Окно 12 точек = 120 с, сдвиг 6 точек = 60 с.
length = 12
stride = 6

[split]
# Разбиение по прогонам, а не по окнам (иначе соседние окна одного прогона
# попадут и в обучение, и в тест). Стратификация по сценарию.
train = 0.6
val = 0.2
test = 0.2

[scenarios]
# Классы с ≥ 99 прогонами разной тяжести и наблюдаемым переходным процессом:
# участвуют в обучении и benchmark (D-004, D-034).
benchmark = ["FLB", "LLB", "LOCA", "LOCAC", "LR", "RI", "RW", "SGATR", "SGBTR", "SLBIC", "SLBOC"]
# Не используются в обучении (D-004, D-034). Две группы:
#   no_event      — траектории совпадают со стационаром (неисправность не проявилась);
#                   ожидаемый ответ системы — «отклонений не обнаружено»;
#   out_of_scope  — реальные переходные процессы вне обучаемого множества;
#                   ожидаемый ответ — «не похоже ни на один известный сценарий».
probe_only = ["ATWS", "LACP", "LOF", "MD", "Normal", "SP", "TT"]
no_event = ["ATWS", "MD", "SP"]
out_of_scope = ["LACP", "LOF", "Normal", "TT"]

[scenarios.titles]
Normal = "нормальная эксплуатация"
LOCA = "течь теплоносителя, горячая нитка"
LOCAC = "течь теплоносителя, холодная нитка"
SLBIC = "разрыв паропровода внутри оболочки"
SLBOC = "разрыв паропровода вне оболочки"
SP = "искра, горение водорода"
LACP = "потеря электропитания переменного тока"
LOF = "потеря расхода (заклинивание ротора ГЦН)"
ATWS = "ожидаемый переходный процесс без срабатывания АЗ"
TT = "отключение турбины"
SGATR = "разрыв трубки ПГ A"
SGBTR = "разрыв трубки ПГ B"
RW = "извлечение регулирующих стержней"
RI = "введение регулирующих стержней"
FLB = "разрыв питательной линии"
MD = "разбавление замедлителя (борного раствора)"
LR = "сброс нагрузки"
LLB = "разрыв линии продувки во вспомогательном здании"

[verifier]
# Каналы label_proxy исключены и из верификатора, чтобы benchmark был честным (D-007).
exclude_label_proxy = true
# Параметры подобраны на val (D-022, D-031):
#   с памятью о событии  — docs/test-results/2026-10-24-verifier-sweep-val-onset.json;
#   без памяти (fallback) — docs/test-results/2026-10-24-verifier-sweep-val.json.
# Минимальный вес признака (доля конкурирующих сценариев вне типичного диапазона
# проверяемого сценария), чтобы признак участвовал в проверке.
min_weight = 0.5
# Сколько наиболее различающих признаков проверять: по текущему окну и по ранней фазе.
top_channels = 15
onset_top_channels = 15
# Отбор признаков с памятью о событии: для каждого конкурента — свои лучшие признаки (D-038);
# без памяти — средняя специфичность против всех конкурентов (на val попарный отбор без памяти
# подтверждал 25 % неверных гипотез).
contrast = "pairwise"
fallback_contrast = "mean"
# Пороги статуса по взвешенной доле подтверждений.
confirm_threshold = 0.7
reject_threshold = 0.4
# Если памяти о начале события нет (ассистент подключился посреди события),
# проверка идёт только по окну с более строгими параметрами.
fallback_min_weight = 0.7
fallback_confirm_threshold = 0.6
# Базовое доверие к свидетельствам (передаётся в EvidenceRef.trust_base).
trust_telemetry = 0.9
trust_historical = 0.6
analogues_k = 3

[novelty]
# Проверка отклонения от исходного состояния (D-032): канал отклонился, если
# |x − x0| / max(|x0|, 1e-3) > rel_threshold. Каналы, которые дрейфуют и без события
# (прогоны ATWS/SP в NPPAD: неисправность с долей 0 %), в подсчёт не входят.
# Событие есть, если отклонившихся каналов больше max_quiet_channels.
rel_threshold = 0.01
drift_channels = ["HTR", "RBLK", "RHFL", "RHMT"]
max_quiet_channels = 0
# Порог новизны — этот перцентиль расстояний на val (известные сценарии).
threshold_quantile = 0.99
# Каждое какое train-окно хранить в эталоне (память и скорость).
window_stride = 3

[selection]
# Итоговое правило (D-033): из подтверждённых гипотез выбирается гипотеза с наибольшей
# долей подтверждений; если вторая подтверждённая отстаёт меньше чем на margin — исход AMBIGUOUS.
margin = 0.1
