# Конфигурация диагностического контура (этапы A–B дорожной карты).
# Все параметры, влияющие на результаты, задаются здесь, а не в коде (требование 13).

config_version = "1.0.0"
seed = 42

[paths]
nppad_raw = "NPPAD/raw/Operation_csv_data"
nppad_reports = "NPPAD/raw/NPPAD"
processed = "data/processed/nppad"
models = "data/models"
ethz_events = "data/processed/ethz/events.json"

[generator]
# Разрешённые каналы генератора: 6 из 96 (D-006).
# По одному представителю на каждую из шести критических функций безопасности
# (Critical Safety Functions), которые оператор PWR контролирует в первую очередь:
#   PWNT — подкритичность (мощность по нейтронному потоку, %)
#   TAVG — охлаждение активной зоны (средняя температура теплоносителя, °C)
#   PSGA — теплоотвод (давление в ПГ A, bar)
#   P    — целостность первого контура (давление, bar)
#   PRB  — защитная оболочка (давление в здании реактора, bar)
#   LVPZ — запас теплоносителя (уровень в компенсаторе давления, %)
allowed_channels = ["PWNT", "TAVG", "PSGA", "P", "PRB", "LVPZ"]
top_k = 3

[windows]
# Шаг данных NPPAD — 10 с. Окно 12 точек = 120 с, сдвиг 6 точек = 60 с.
length = 12
stride = 6

[split]
# Разбиение по прогонам, а не по окнам (иначе соседние окна одного прогона
# попадут и в обучение, и в тест). Стратификация по сценарию.
train = 0.6
val = 0.2
test = 0.2

[scenarios]
# Классы, в которых есть ≥ 99 прогонов разной тяжести: участвуют в обучении и benchmark (D-004).
benchmark = ["FLB", "LLB", "LOCA", "LOCAC", "LR", "MD", "RI", "RW", "SGATR", "SGBTR", "SLBIC", "SLBOC"]
# Классы с единственным прогоном: разбить по прогонам невозможно.
# Используются только как пробы «вне распределения» (верификатор должен не подтверждать гипотезы).
probe_only = ["ATWS", "LACP", "LOF", "Normal", "SP", "TT"]

[scenarios.titles]
Normal = "нормальная эксплуатация"
LOCA = "течь теплоносителя, горячая нитка"
LOCAC = "течь теплоносителя, холодная нитка"
SLBIC = "разрыв паропровода внутри оболочки"
SLBOC = "разрыв паропровода вне оболочки"
SP = "искра, горение водорода"
LACP = "потеря электропитания переменного тока"
LOF = "потеря расхода (заклинивание ротора ГЦН)"
ATWS = "ожидаемый переходный процесс без срабатывания АЗ"
TT = "отключение турбины"
SGATR = "разрыв трубки ПГ A"
SGBTR = "разрыв трубки ПГ B"
RW = "извлечение регулирующих стержней"
RI = "введение регулирующих стержней"
FLB = "разрыв питательной линии"
MD = "разбавление замедлителя (борного раствора)"
LR = "сброс нагрузки"
LLB = "разрыв линии продувки во вспомогательном здании"

[verifier]
# Каналы label_proxy исключены и из верификатора, чтобы benchmark был честным (D-007).
exclude_label_proxy = true
# Минимальный вес признака (доля окон конкурирующих сценариев вне типичного
# диапазона проверяемого сценария), чтобы признак участвовал в проверке.
min_weight = 0.7
# Сколько наиболее различающих признаков (канал × уровень/тренд) проверять.
top_channels = 15
# Пороги статуса по взвешенной доле подтверждений.
# min_weight, top_channels, confirm_threshold подобраны на val (D-022,
# docs/test-results/2026-10-24-verifier-sweep-val.json).
confirm_threshold = 0.6
reject_threshold = 0.4
# Базовое доверие к свидетельствам (передаётся в EvidenceRef.trust_base).
trust_telemetry = 0.9
trust_historical = 0.6
analogues_k = 3
