# Пакет правил верификатора ответа aes-core 1.1.0 (требование 9; этап C, D-035).
# Отличия от 1.0.0: правила DIAGNOSIS_CONFIRMED и NO_DIRECTIVES; веса доверия те же.
#
# Правила детерминированы и не используют LLM. Решение «выпустить или нет»
# принимают только правила и политика; LLM может лишь структурировать ответ.
# Любое изменение правил, порогов или весов доверия = новая версия пакета.

pack_id = "aes-core-1.1.0"

# Уверенность ответа (минимум по цепочке утверждение → источник) ниже порога → REQUIRE_HUMAN.
min_confidence = 0.5

[[rule]]
rule_id = "EVIDENCE_REQUIRED"
severity = "error"
description = "Ответ содержит хотя бы одно утверждение, и у каждого утверждения есть хотя бы одна ссылка на источник."

[[rule]]
rule_id = "NO_MODEL_ONLY"
severity = "warning"
description = "Нет утверждений, опирающихся только на текст модели (MODEL_GENERATED)."

[[rule]]
rule_id = "REF_RESOLVABLE"
severity = "error"
description = "Каждая ссылка (кроме MODEL_GENERATED) разрешается в существующий артефакт: фрагмент базы знаний, запуск кода, окно NPPAD, событие ETHZ."

[[rule]]
rule_id = "DIAGNOSIS_CONFIRMED"
severity = "warning"
description = "Диагностическое утверждение выпускается без пометки, только если исход определённый: ситуация установлена однозначно (IDENTIFIED) или отклонений нет (NO_ANOMALY)."

[[rule]]
rule_id = "NO_DIRECTIVES"
severity = "error"
description = "Ответ не содержит указаний к действию (система только интерпретирует ситуацию; инварианты Upgrade)."

# Базовое доверие к классу источника. Задаётся политикой домена, а не агентом:
# значение trust_base, присланное агентом, верификатор заменяет значением отсюда (D-015).
[trust_base]
regulatory_doc = 0.95
human = 1.0
telemetry = 0.9
tool_output = 0.8
rag_chunk = 0.7
historical_event = 0.6
model = 0.2
